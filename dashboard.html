<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yana & You - Admin Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginBox" class="login-container">

    <div class="login-card">

        <h1>Yana & You</h1>
        <p>Admin Dashboard</p>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button onclick="login()" class="primary-btn">
            Login
        </button>

        <p id="loginMessage" class="message"></p>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard" class="dashboard hidden">

    <!-- HEADER -->

    <header class="dashboard-header">

        <div>
            <h1>Yana & You</h1>
            <p>Admin Dashboard</p>
        </div>

        <button onclick="logout()" class="logout-btn">
            Logout
        </button>

    </header>


    <main class="dashboard-content">


        <!-- ================= ADD PRODUCT ================= -->

        <section class="add-product-section">

            <div class="section-title">
                <div>
                    <h2>Add Product</h2>
                    <p>Add a new product to your store</p>
                </div>
            </div>


            <div class="product-form">

                <div class="form-group">

                    <label>Product Name</label>

                    <input
                        id="pname"
                        type="text"
                        placeholder="Enter product name"
                    >

                </div>


                <div class="form-group">

                    <label>Description</label>

                    <input
                        id="pdesc"
                        type="text"
                        placeholder="Enter product description"
                    >

                </div>


                <div class="form-group">

                    <label>Price</label>

                    <input
                        id="pprice"
                        type="number"
                        placeholder="0.00"
                    >

                </div>


                <div class="form-group">

                    <label>Product Image</label>

                    <input
                        id="pimage"
                        type="file"
                        accept="image/*"
                    >

                </div>


                <button
                    onclick="addProduct()"
                    class="primary-btn add-btn"
                >
                    + Add Product
                </button>

            </div>

        </section>



        <!-- ================= PRODUCTS ================= -->

        <section class="products-section">

            <div class="section-title">

                <div>
                    <h2>Products</h2>
                    <p>Manage products available in your store</p>
                </div>

            </div>


            <div id="products" class="products-grid">

                <!-- Products generated by JavaScript -->

            </div>

        </section>



        <!-- ================= ORDERS ================= -->

        <section class="orders-section">

            <div class="section-title">

                <div>
                    <h2>Orders</h2>
                    <p>View and manage customer orders</p>
                </div>

            </div>


            <div class="orders-table-container">

                <table class="orders-table">

                    <thead>

                        <tr>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>

                    </thead>


                    <tbody id="orders">

                        <!-- Orders generated by JavaScript -->

                    </tbody>

                </table>

            </div>

        </section>


    </main>

</div>


<script src="dashboard.js"></script>

</body>
</html>
